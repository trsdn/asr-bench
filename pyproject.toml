[project]
name = "asr-bench"
version = "0.1.0"
description = "Side-by-side ASR benchmark harness for local open-weight models (Parakeet, Canary, Whisper) on recorded session audio."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Whisper-Large-v3 via CTranslate2 runtime — fast, Mac-friendly, no
    # PyTorch dependency needed just for this one model.
    "faster-whisper>=1.1.0",

    # NVIDIA NeMo — runtime for Parakeet-TDT and Canary-1b-flash.
    # Heavy install (~3 GB of deps incl. PyTorch) but it's the official
    # path for both NVIDIA ASR families. MPS acceleration works on Apple
    # Silicon for inference; falls back to CPU otherwise.
    "nemo-toolkit[asr]>=2.0.0",

    # Audio IO + conversion (CAF → WAV 16 kHz mono as all three models
    # expect). soundfile reads CAF via libsndfile; ffmpeg is used as a
    # fallback via pydub when soundfile can't read the variant.
    "soundfile>=0.12",
    "librosa>=0.10",
    "numpy>=1.26",

    # Conversation scripts for the synthesiser. score.py deliberately has
    # no scoring dependency: it ships its own Levenshtein alignment and
    # number speller, and picks up jiwer / num2words automatically if you
    # install them (see the `scoring` extra).
    "pyyaml>=6.0",

    # TTS engines. Rendering the same script through several unrelated
    # synthesis lineages is what keeps the benchmark from measuring one
    # synthesiser instead of the models — see "TTS backends" in the
    # README. macOS `say` needs nothing installed and stays the default,
    # so both of these are cheap additions rather than hard requirements
    # for the basic path.
    "piper-tts>=1.7",
    "kokoro>=0.9",

    # Report rendering
    "rich>=13",
]

[project.optional-dependencies]
# Models that pull in a bespoke tokenizer or a newer transformers than
# the NeMo pin allows. Kept out of the default install so a plain
# `uv sync` cannot break the NeMo runtime.
extra-models = [
    # Voxtral's tokenizer.
    "mistral-common[audio]>=1.11",
]
# score.py ships its own Levenshtein alignment and number speller, and
# picks these up automatically when present. Installing them switches it
# to the reference implementations.
scoring = [
    "jiwer>=3.1",
    "num2words>=0.5",
]
# pyannote is the standard diarisation baseline and is natively
# overlap-aware. Every model is gated on HuggingFace, so it also needs
# an accepted licence and an HF_TOKEN.
diarisation = [
    "pyannote.audio>=4.0",
]


# bench.py loads the .env manually at import time so `uv run` keeps
# the cache redirection even when invoked ad-hoc without a shell that
# sources .env first. No uv-side env-file wiring needed.
