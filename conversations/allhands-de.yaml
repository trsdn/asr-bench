turns:
  - speaker: a
    text: "Guten Morgen zusammen, wir sind vollzählig, dann fangen wir an."
  - speaker: a
    text: "Erster Punkt ist der Vorfall von gestern Nacht, Ticket vier null neun, Strich, zwei eins."
    gap: 0.3

  - speaker: b
    text: "Ich kann das kurz zusammenfassen."
    gap: 0.2
  - speaker: b
    text: "Um zwei Uhr dreiundzwanzig ist der Load Balancer ausgefallen, und zwar komplett."
    gap: 0.25

  # c cuts in before b is done
  - speaker: c
    text: "Moment, komplett oder nur die eine Region?"
    gap: -0.5

  - speaker: b
    text: "Nur eu-west, aber der Failover hat nicht gegriffen."
    gap: 0.15

  - speaker: d
    text: "Das ist der Punkt, der mich beunruhigt."
    gap: 0.2
  - speaker: d
    text: "Wir haben das Failover seit dem Deployment im Juni nicht mehr getestet."
    gap: 0.2

  # two people answer at once
  - speaker: e
    text: "Doch, im August, ich hatte das im Staging durchgespielt."
    gap: -0.7
  - speaker: f
    text: "Im Staging zählt aber nicht, das ist eine andere Konfiguration."
    gap: -0.9

  - speaker: a
    text: "Einer nach dem anderen, bitte."
    gap: 0.3

  - speaker: e
    text: "Kurz nur: im Staging lief es sauber durch, dreiunddreißig Sekunden bis zum Umschalten."
    gap: 0.25

  - speaker: f
    text: "Und in Produktion sind es hundertachtzig Sekunden, das ist der ganze Unterschied."
    gap: 0.2

  - speaker: c
    text: "Genau."
    gap: 0.15

  - speaker: b
    text: "Ich würde vorschlagen, wir ziehen das Timeout runter und testen es im Rahmen des nächsten Wartungsfensters."
    gap: 0.3

  - speaker: d
    text: "Wann ist das Fenster?"
    gap: 0.2

  - speaker: a
    text: "Am achtzehnten, zwischen zwei und vier Uhr morgens."
    gap: 0.2

  - speaker: c
    text: "Da bin ich nicht da."
    gap: 0.15
  - speaker: c
    text: "Kann jemand anderes das Monitoring übernehmen?"
    gap: 0.2

  - speaker: e
    text: "Ich mache das."
    gap: 0.15

  - speaker: f
    text: "Ich hänge mich mit rein, dann sind wir zu zweit."
    gap: -0.4

  - speaker: a
    text: "Gut, dann ist das gesetzt."
    gap: 0.3
  - speaker: a
    text: "Zweiter Punkt, und da brauche ich eine Entscheidung: das Caching-Layer."
    gap: 0.25

  - speaker: d
    text: "Ich bin dagegen, das jetzt anzufassen."
    gap: 0.2

  - speaker: b
    text: "Warum denn, die Latenz ist seit Wochen bei ungefähr vierhundert Millisekunden."
    gap: -0.5

  - speaker: d
    text: "Weil wir mitten in einem Incident-Nachgang stecken und nicht zwei Baustellen gleichzeitig aufmachen sollten."
    gap: 0.2

  - speaker: c
    text: "Da ist was dran."
    gap: 0.15

  - speaker: e
    text: "Andererseits ist die Latenz genau der Grund, warum der Support so viele Tickets bekommt."
    gap: 0.2

  - speaker: f
    text: "Wie viele denn konkret?"
    gap: 0.2

  - speaker: e
    text: "Letzte Woche siebenundzwanzig, davon neunzehn mit Timeout im Betreff."
    gap: 0.2

  - speaker: a
    text: "Okay, das ist ein Argument."
    gap: 0.25
  - speaker: a
    text: "Ich schlage vor, wir machen einen Zeitplan: Failover diese Woche, Caching nächste."
    gap: 0.25

  - speaker: b
    text: "Damit kann ich leben."
    gap: 0.2

  - speaker: d
    text: "Ich auch, wenn wir das Rollback vorher schreiben."
    gap: -0.3

  - speaker: a
    text: "Einverstanden."
    gap: 0.2
  - speaker: a
    text: "Marek schreibt das Rollback, Pia und Stefan machen das Wartungsfenster, Yasemin dokumentiert den Vorfall."
    gap: 0.25

  - speaker: c
    text: "Bis wann?"
    gap: 0.2

  - speaker: a
    text: "Bis Freitag, damit wir es im nächsten Review haben."
    gap: 0.2

  - speaker: f
    text: "Dann bräuchte ich noch die Logs von gestern Nacht."
    gap: 0.2

  - speaker: b
    text: "Schicke ich dir gleich nach dem Meeting."
    gap: 0.15

  - speaker: a
    text: "Gut, dann sind wir durch, danke euch."
    gap: 0.3
