name: allhands-de
language: de
notes: >
  Deutsches Team-Meeting mit sechs Sprechern — bewusst zwei mehr als
  Sortformers harte Grenze von vier.

  Alle bisherigen Sessions haben zwei bis vier Sprecher, und vier ist
  exakt die Obergrenze der End-to-End-Modelle. Damit ist der für echte
  Meetings wichtigste Fall nie gemessen worden: mehr Teilnehmer, als das
  Modell überhaupt repräsentieren kann. Ob es dann zwei Personen still
  zusammenlegt oder eine fallen lässt, sind zwei verschiedene Fehler, und
  cpWER bepreist sie unterschiedlich — eine Verschmelzung verseucht zwei
  Ströme, ein Auslassen kostet die Wörter einer Person als Deletions.

  Zweiter Zweck: die Gegenprobe zum Befund, dass TitaNet mit der korrekten
  Sprecherzahl 21 Punkte schlechter wurde als ohne. Clustering hat keine
  Obergrenze, End-to-End schon — bei sechs Sprechern könnte das die
  Rangfolge umdrehen.

  Enthält deshalb bewusst: mehrere kurze Wortmeldungen (die Fragmente
  erzeugen, an denen die Diarisation hier reihenweise scheitert),
  Überlappung an Sprecherwechseln, englische Lehnwörter und gesprochene
  Zahlen als Kennungen.

