name: longform-de
language: de
notes: >
  Eine lange Session, in der die Dauer die einzige geänderte Variable ist.

  Alle bisherigen Sessions dauern ein bis zwei Minuten. Echte Meetings
  dauern dreißig bis sechzig. Ob die gemessenen Ergebnisse überhaupt
  übertragbar sind, hängt daran, ob Fehler mit der Laufzeit wachsen —
  und dafür gibt es drei konkrete Mechanismen: Whisper dekodiert in
  Dreißig-Sekunden-Fenstern und kann in Wiederholungsschleifen laufen,
  Clustering-Diarisation driftet, wenn eine Stimme später anders klingt
  als am Anfang, und ein einmal falsch angelegter Cluster verunreinigt
  alles, was danach kommt.

  Der Aufbau hält deshalb alles außer der Länge fest: exakt dieselben
  sechs Sprecher wie in allhands-de, dieselben Stimmen, dieselben Raten.
  Die letzten einundvierzig Turns SIND allhands-de, unverändert. Davor
  stehen zwei weitere Themenblöcke mit völlig anderem Text, auf
  dieselben sechs Sprecher verteilt. Damit ist ein direkter Vergleich
  möglich: dasselbe Material einmal allein und einmal am Ende einer
  mehr als doppelt so langen Aufnahme. Steigt der cpWER des dritten
  Blocks gegenüber der eigenständigen Session, ist das Laufzeitdrift
  und nichts anderes.

  Bewusst enthalten sind Themenwechsel mit längeren Pausen, weil genau
  dort ein Modell den Kontext verliert und eine Diarisation dazu neigt,
  eine bekannte Stimme als neue zu behandeln.

  Ehrliche Einschränkung: viereinhalb Minuten sind noch keine dreißig.
  Das ist die Richtung, nicht das Ziel.

